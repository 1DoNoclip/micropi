[project]
name = "micropi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "1DoNoclip", email = "samuelfrith08@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "adafruit-blinka>=9.2.0 ; (platform_machine == 'aarch64' and sys_platform == 'linux') or (platform_machine == 'armv7l' and sys_platform == 'linux')",
    "adafruit-circuitpython-ssd1306>=2.12.24 ; (platform_machine == 'aarch64' and sys_platform == 'linux') or (platform_machine == 'armv7l' and sys_platform == 'linux')",
    "pillow>=12.3.0",
    "rpi-gpio>=0.7.1 ; (platform_machine == 'aarch64' and sys_platform == 'linux') or (platform_machine == 'armv7l' and sys_platform == 'linux')",
    "rpi-ws281x>=5.0.0 ; (platform_machine == 'aarch64' and sys_platform == 'linux') or (platform_machine == 'armv7l' and sys_platform == 'linux')",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
